name: Flick
options:
  bundleIdPrefix: com.zhoudaheng7
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.4.0'
    CURRENT_PROJECT_VERSION: '4'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Flick:
    type: application
    platform: iOS
    sources: [App, Core]
    dependencies:
      - target: FlickShare
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 一甩
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: 发现附近已确认的一甩设备，直接传送照片、视频和文件。
        NSBonjourServices: ['_flick-photo._tcp', '_flick-photo._udp']
        NSBluetoothAlwaysUsageDescription: 与附近已确认的一甩设备建立传输连接。
        NSNearbyInteractionUsageDescription: 显示已连接 iPhone 的真实方向和距离，让你向朋友的方位甩送。
        NSPhotoLibraryAddUsageDescription: 只有在你点击保存时，才把收到的照片保存到系统相册。
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.zhoudaheng7.Flick.receive
            CFBundleURLSchemes: [flick]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: com.zhoudaheng7.Flick
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: 'FlickPhoto FlickRipple FlickOrange FlickDuet FlickHappy'
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  FlickShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Core, App/PeerLink.swift, App/BluetoothTransport.swift, App/MediaSelection.swift, App/ReceiveInbox.swift, App/PhotoAsset.swift, App/FlickViews.swift, App/SpatialLocator.swift, App/LocalIdentity.swift, App/SoundFeedback.swift, App/SettingsViews.swift, App/Resources]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: 一甩
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: 在分享窗口直接连接已确认设备，传送原文件。
        NSBonjourServices: ['_flick-photo._tcp', '_flick-photo._udp']
        NSBluetoothAlwaysUsageDescription: 发现附近已确认的一甩设备。
        NSNearbyInteractionUsageDescription: 在分享窗口显示已连接 iPhone 的方向和距离。
        NSPhotoLibraryAddUsageDescription: 由你选择是否把收到的内容存入照片。
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 50
              NSExtensionActivationSupportsMovieWithMaxCount: 50
              NSExtensionActivationSupportsFileWithMaxCount: 50
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhoudaheng7.Flick.Share
        TARGETED_DEVICE_FAMILY: '1'
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) APP_EXTENSION'
        SKIP_INSTALL: YES
  FlickMediaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MediaTests]
    dependencies:
      - target: Flick
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zhoudaheng7.Flick.MediaTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Flick.app/Flick
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Flick:
    build:
      targets:
        Flick: all
    test:
      targets: [FlickMediaTests]
