name: Flick
options:
  bundleIdPrefix: com.zhoudaheng7
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Flick:
    type: application
    platform: iOS
    sources: [App, Core]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 一甩
        NSLocalNetworkUsageDescription: 在你确认连接后，发现附近的一甩设备并直接传送照片。
        NSBonjourServices: ['_flick-photo._tcp', '_flick-photo._udp']
        NSBluetoothAlwaysUsageDescription: 与附近已确认的一甩设备建立传图连接。
        NSPhotoLibraryAddUsageDescription: 只有在你点击保存时，才把收到的照片保存到系统相册。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: com.zhoudaheng7.Flick
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
schemes:
  Flick:
    build:
      targets:
        Flick: all
