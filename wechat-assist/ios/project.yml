name: WeChatAssist
options:
  bundleIdPrefix: com.personal.chatassist
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  WeChatAssist:
    type: application
    platform: iOS
    sources: [WeChatAssist]
    info:
      path: WeChatAssist/Info.plist
      properties:
        CFBundleDisplayName: 知会
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: 连接你的 Windows 助手，同步你选定聊天的识别文字和回复草稿。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.chatassist.WeChatAssist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
schemes:
  WeChatAssist:
    build:
      targets:
        WeChatAssist: all
