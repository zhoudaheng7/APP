name: Luxquare
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
targets:
  Luxquare:
    type: application
    platform: iOS
    sources:
      - Sources/Luxquare
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.luxquare.app
        PRODUCT_NAME: Luxquare
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
  LuxquareUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Luxquare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.luxquare.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Luxquare
schemes:
  Luxquare:
    build:
      targets:
        Luxquare: all
    test:
      targets:
        - LuxquareUITests
