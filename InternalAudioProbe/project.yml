name: InternalAudioProbe
options:
  bundleIdPrefix: com.lightsquare
  deploymentTarget:
    iOS: "27.0"
packages:
  AudioCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    AUDIO_APP_GROUP: group.com.lightsquare.internalaudioprobe
targets:
  InternalAudioProbe:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: AudioCore
        product: AudioCore
      - target: InternalAudioBroadcast
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightsquare.internalaudioprobe
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/AudioCapture.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    scheme:
      gatherCoverageData: false
      testTargets: [InternalAudioProbeUITests]
  InternalAudioBroadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    dependencies:
      - package: AudioCore
        product: AudioCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightsquare.internalaudioprobe.broadcast
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Broadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Broadcast/AudioCapture.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  InternalAudioProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: InternalAudioProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightsquare.internalaudioprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: InternalAudioProbe
