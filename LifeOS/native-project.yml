name: LifeOS
options:
  bundleIdPrefix: app.lifeos
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  LifeOSCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ''
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LifeOS:
    type: application
    platform: iOS
    sources: [NativeApp]
    dependencies:
      - package: LifeOSCore
        product: LifeOSDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lifeos.personal
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: LifeOS
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocationWhenInUseUsageDescription: 仅在你主动定位、保存地点或开始前台路线时使用位置，精确位置只保存在本机。
        LifeOSUpdateManifestURL: ''
    scheme:
      testTargets: [LifeOSNativeTests, LifeOSUITests]
  LifeOSNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NativeTests]
    dependencies:
      - target: LifeOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.lifeos.tests
  LifeOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NativeUITests]
    dependencies:
      - target: LifeOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.lifeos.uitests
