name: LifeOS
options:
  bundleIdPrefix: app.lifeos
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
packages:
  LifeOSCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ''
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LifeOS:
    type: application
    platform: iOS
    sources:
      - path: NativeApp
        excludes: [Resources]
      - path: NativeApp/Resources
        buildPhase: resources
    dependencies:
      - package: LifeOSCore
        product: LifeOSDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lifeos.personal
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 朝屿
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocationWhenInUseUsageDescription: 用于你主动定位、保存地点与开始短路线；精确位置保存在本机。
        NSLocationAlwaysAndWhenInUseUsageDescription: 仅在你主动开启自动到访时，用低功耗到访事件帮助回顾去过的地方；你可以随时暂停。
        NSCalendarsFullAccessUsageDescription: 仅在你点击读取日历后，显示所选日期事件，并由你逐条选择导入为承诺。
        UIBackgroundModes: [location]
        LifeOSUpdateManifestURL: ''
        LifeOSWorkbenchURL: ''
    scheme:
      testTargets: [LifeOSNativeTests, LifeOSUITests]
  LifeOSNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NativeTests
        excludes: [Fixtures]
      - path: NativeTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: LifeOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.lifeos.tests
  LifeOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NativeUITests]
    dependencies:
      - target: LifeOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.lifeos.uitests
