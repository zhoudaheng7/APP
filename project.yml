name: ScrollShot
options:
  bundleIdPrefix: com.zhoudaheng7
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  ScrollShot:
    type: application
    platform: iOS
    sources:
      - ScrollShot
      - Shared
    info:
      path: ScrollShot/Info.plist
      properties:
        CFBundleDisplayName: 录屏转长图
        CFBundleURLTypes:
          - CFBundleURLName: scrollshot
            CFBundleURLSchemes: [scrollshot]
        NSPhotoLibraryAddUsageDescription: 将生成的长图保存到你的照片图库。
        NSPhotoLibraryUsageDescription: 选择你需要转换成长图的录屏。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhoudaheng7.ScrollShot
    dependencies:
      - target: Broadcast
        embed: true
  Broadcast:
    type: app-extension
    platform: iOS
    sources:
      - Broadcast
      - Shared
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: 长图录屏
        NSPhotoLibraryAddUsageDescription: 在你结束滚动录屏后保存生成的长图。
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhoudaheng7.ScrollShot.Broadcast
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  ScrollShotTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ScrollShot
schemes:
  ScrollShot:
    build:
      targets:
        ScrollShot: all
        Broadcast: all
    test:
      targets: [ScrollShotTests]
