name: Validate Flick Native Development
on:
  workflow_dispatch:
  push:
    branches: ['codex/flick-ipa']
    paths: ['Flick/**', '.github/workflows/build-flick.yml']
permissions:
  contents: read
concurrency:
  group: flick-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  iphone:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Flick
    steps:
      - uses: actions/checkout@v4
      - name: Inspect native toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install Xcode project generator
        run: brew install xcodegen
      - name: Verify transfer rules and acknowledgements
        run: |
          set -o pipefail
          mkdir -p output
          swift test | tee output/core-tests.log
      - name: Generate native project
        run: xcodegen generate
      - name: Build actual iPhone application
        run: |
          set -o pipefail
          xcodebuild build -project Flick.xcodeproj -scheme Flick \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO | tee output/device-build.log
      - name: Test original video and ordered multi-selection on iOS Simulator
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if "iPhone" in x["name"]))')
          xcodebuild test -project Flick.xcodeproj -scheme Flick \
            -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath output/media-tests.xcresult | tee output/media-tests.log
      - name: Upload compile and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flick-Development-Checks-v0.4
          path: Flick/output/
          if-no-files-found: error
          retention-days: 14
