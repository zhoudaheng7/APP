name: Build Luxquare iPhone
on:
  push:
    branches: [codex/luxquare-ios-v1]
    paths: [Luxquare/**, .github/workflows/luxquare-ios.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: luxquare-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-iphone:
    runs-on: xcode-27
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: Luxquare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build unsigned device IPA and exercise Simulator
        run: bash tools/macos-build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Luxquare-iPhone
          path: |
            Luxquare/dist/
            !Luxquare/dist/Smoke.xcresult/**
          if-no-files-found: warn
          retention-days: 7
