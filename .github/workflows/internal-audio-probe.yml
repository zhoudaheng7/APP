name: Build Internal Audio Probe IPA
on:
  push:
    branches: [codex/internal-audio-probe]
    paths: [InternalAudioProbe/**, .github/workflows/internal-audio-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: internal-audio-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  device-ipa:
    runs-on: xcode-27
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: InternalAudioProbe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify Xcode and iPhoneOS SDK
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_27.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          mkdir -p dist
          xcodebuild -version | tee dist/toolchain.txt
          xcrun --sdk iphoneos --show-sdk-version | tee -a dist/toolchain.txt
          xcrun --sdk iphoneos --show-sdk-version | grep -E '^27\.'
      - name: Test actual audio encoding and inspect file tracks
        run: |
          set -euo pipefail
          export AUDIO_CORE_UI_FIXTURE="$PWD/dist/ui-fixture"
          swift test 2>&1 | tee dist/audio-tests.log
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          bash scripts/prepare_icon.sh
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Build unsigned arm64 iPhone application
        run: |
          set -euo pipefail
          xcodebuild build -project InternalAudioProbe.xcodeproj -scheme InternalAudioProbe \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee dist/iphone-build.log
      - name: Package and verify IPA
        run: |
          set -euo pipefail
          python3 scripts/package_ipa.py build/device/Build/Products/Release-iphoneos/InternalAudioProbe.app dist/InternalAudioProbe-unsigned.ipa
          git rev-parse HEAD > dist/source-commit.txt
          cp README.md dist/INSTALL.txt
          cp SIGNING.md dist/SIGNING.txt
          cp Design/OPEN-SOURCE.md dist/OPEN-SOURCE.txt
          cp Design/DEVICE-CHECKS.md dist/DEVICE-CHECKS.txt
          cp App/Resources/HaishinKit-LICENSE.txt dist/HaishinKit-LICENSE.txt
          cp App/AudioCapture.entitlements dist/MainApp.entitlements
          cp Broadcast/AudioCapture.entitlements dist/Broadcast.entitlements
      - name: Test standalone PCM statistics
        run: |
          set -euo pipefail
          mkdir -p ProbeTests/Sources/ProbeStats
          cp Probe/ProbeSignalStats.swift ProbeTests/Sources/ProbeStats/ProbeSignalStats.swift
          swift test --package-path ProbeTests 2>&1 | tee dist/probe-tests.log
      - name: Build independent call-audio experiment for iPhone
        run: |
          set -euo pipefail
          xcodebuild build -project InternalAudioProbe.xcodeproj -scheme CallAudioProbe \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/call-probe CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee dist/call-probe-build.log
          python3 scripts/package_call_probe.py build/call-probe/Build/Products/Release-iphoneos/CallAudioProbe.app dist/CallAudioProbe-0.1.0-unsigned.ipa
          cp Design/CALL-CAPTURE.md dist/CALL-CAPTURE.txt
      - name: Verify playback feedback and track-check UI in iPhone Simulator
        run: bash scripts/run_ui_smoke.sh
      - name: Check standalone probe UI and simulator capability reporting
        run: bash scripts/run_probe_ui_smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: InternalAudioProbe-iPhone
          path: |
            InternalAudioProbe/dist/
            !InternalAudioProbe/dist/Interaction.xcresult/**
            !InternalAudioProbe/dist/ProbeInteraction.xcresult/**
            !InternalAudioProbe/dist/ui-fixture/**
          if-no-files-found: warn
          retention-days: 14
