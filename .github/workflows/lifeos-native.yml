name: Build LifeOS iPhone
on:
  push:
    branches: [codex/lifeos-native-v1]
    paths: [LifeOS/**, .github/workflows/lifeos-native.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lifeos-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-iphone:
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      DAYISLE_TEST_MODE: unit
    defaults:
      run:
        shell: bash
        working-directory: LifeOS
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Build and test native iPhone app
        run: bash tools/build-native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: LifeOS-iPhone
          path: |
            LifeOS/dist/
            !LifeOS/dist/Native.xcresult/**
          if-no-files-found: warn
          retention-days: 7
