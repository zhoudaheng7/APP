name: Build iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ScrollShot/**'
      - 'Broadcast/**'
      - 'Shared/**'
      - 'Tests/**'
      - 'project.yml'
      - 'Package.swift'
      - 'scripts/**'
      - '.github/workflows/build-ios.yml'
permissions:
  contents: read
concurrency:
  group: iphone-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Inspect Xcode
        run: xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify matcher and stitching
        run: |
          set -o pipefail
          mkdir -p output
          swift test | tee test.log
      - name: Build app and recording extension for iPhone
        run: |
          set -o pipefail
          xcodebuild build -project ScrollShot.xcodeproj -scheme ScrollShot \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO | tee build.log
      - name: Package IPA for Windows signing
        run: python3 scripts/package_ipa.py build/device/Build/Products/Release-iphoneos/ScrollShot.app output/ScrollShot-unsigned.ipa
      - name: Upload IPA and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScrollShot-iPhone
          path: |
            output/ScrollShot-unsigned.ipa
            test.log
            build.log
          if-no-files-found: error
          retention-days: 14
